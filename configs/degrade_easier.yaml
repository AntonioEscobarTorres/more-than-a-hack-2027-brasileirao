# ---- configs/degrade_easier.yaml: A.6 stress variant: target_ball_visible 0.68, phantom_frac 0.005, target_tracked_mean 21.5 (21.3 here, see below); player_noise_m = default x 0.10/0.15. Other keys = default. ----
name: easier
target_ball_visible: 0.68
target_ball_visible_tolerance: 0.01
target_tracked_mean: 21.3  # A.6 asks 21.5; J03WN1 tracks at most 21.05, so 21.3 is the largest target feasible on all 7 matches (D-017)
target_tracked_mean_tolerance: 0.3
z_air_m: 1.5
air_margin_frames: 3
p_air: 0.0
crowd_n: 3
crowd_r_m: 2.0
crowd_hazard: 0.02
bg_hazard_init: 0.01
hazard_max: 1.0
bisection_iterations: 30
player_bisection_iterations: 30
ball_noise_m: 0.25
phantom_len_frames: [5, 60]
phantom_frac: 0.005
phantom_margin_m: 5.0
player_visible_mean_s: 30.0
player_missing_mean_s_init: 3.0
player_missing_mean_s_max: 120.0
player_noise_m: 0.0067
dup_offset_m: 0.3
dup_len_s: [1.0, 5.0]
dup_frac: 0.02
dup_max_attempts: 10000
overtracked_threshold: 22
fps: 25
p_unfreeze_hide: 0.5
restart_visible_s: 1.5
unfreeze_drift_mps: 1.5
unfreeze_drift_tau_s: 1.0
bg_slow_speed_mps: 1.0
bg_slow_factor: 40.0
gap_profile:
  mix_geometric: 0.3
  geometric_mean_frames: 8.0
  lognormal_median_frames: 150.0
  lognormal_sigma: 1.0
  max_frames: 1500
