# CI (task F5-03): the full synthetic test suite on every push and pull request.
# No match data exists here: tests use only synthetic fixtures (rule 1.4.1 of the plan).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-modeling.txt
            requirements-preprocessing.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-modeling.txt

      - name: Run tests
        run: pytest -q
